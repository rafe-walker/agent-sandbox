name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Linux sandbox suite. MUST NOT skip silently: if namespace support is
  # missing the job fails closed.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2 nftables
      - name: Verify namespace support (fail closed)
        run: |
          set -e
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          # This runner is ephemeral, so lift that restriction explicitly and
          # visibly here (never on a real host). If namespaces still do not
          # work, the smoke below FAILS the job; it never skips.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ "$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 1)" = "0" ]; then
            echo "::error::Unprivileged user namespaces are disabled on this runner. Failing closed."
            exit 1
          fi
          # Real bwrap smoke (as the runner user AND as an unprivileged uid,
          # which is how the launcher runs it) so a broken runner fails here.
          # /lib64 is required: /bin/true needs the dynamic loader.
          ARGS="--unshare-user --unshare-pid --unshare-net --die-with-parent \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp -- /bin/true"
          bwrap $ARGS
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups -- bwrap $ARGS
          echo "namespaces OK"
      - run: npm ci
      - name: Run full suite under sandbox (never AGENT_SANDBOX_SKIP)
        env:
          AGENT_SANDBOX_REQUIRE_CAPS: "1"
        run: npm test
